[project]
name = "qira-ocr"
version = "0.1.0"
description = "Hybrid multi-engine OCR for Arabic and English documents"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
dependencies = [
    "paddleocr>=2.9",
    "paddlepaddle>=3.0",
    "paddlex[ocr]",
    "surya-ocr>=0.20,<0.23",
    "pymupdf>=1.25",
    "Pillow>=11.0",
    "transformers>=5",
]

[project.optional-dependencies]
cli = ["click>=8.1"]
api = ["fastapi>=0.115", "uvicorn>=0.34", "python-multipart>=0.0.20"]
qari = ["qwen-vl-utils>=0.0.8", "accelerate>=0.26.0", "torchvision"]
all = ["qira-ocr[cli,api,qari]"]

[project.scripts]
qira-ocr = "qira_ocr.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/qira_ocr"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "requires_ocr_server: needs downloaded OCR models (paddle/surya) or a running llama-server/vllm; deselected in CI",
]

[dependency-groups]
dev = ["pytest>=9", "ruff>=0.15"]

[tool.uv]
override-dependencies = [
    "pillow>=10.2.0",
]

[tool.ruff.lint.per-file-ignores]
"src/qira_ocr/api.py" = ["B008"]  # FastAPI File()/Form() defaults
